# mp3blasterr configuration file (copy to ~/.config/mp3blasterr/config.yaml).
#
# Settings are grouped in sections; setting names are snake_case. All
# values shown are the defaults: uncomment a line (and the header of a
# nested section such as "colors:") to change it. Quote values starting
# with a YAML special character, e.g. "#" or "*". Single quotes keep
# backslashes as they are, which suits regular expressions: '\.mp3$'.

ui:
  # theme: classic           # classic or modern (switch at run time: T)
  # nerd_font: false         # needs a Nerd Font in the terminal (toggle: I)
  # mouse: true
  # list_width: 75%          # width of the file/playlist window: a
  #                          # percentage of the terminal (min. 60 columns),
  #                          # a number of columns, or 0 = terminal width - 12
  #                          # (original behaviour)
  # display_mode: filename  # playlist: path, filename or id3 (toggle: f)
  # wrap_around: true        # moving past the end of a list wraps around
  # pan_size: 5              # columns panned by left/right (1..40)

  # Colours: black, red, green, yellow, blue, magenta, cyan, white, default
  # or "#rrggbb" (quoted). "default" is the terminal's own (possibly
  # translucent) background; set colors.default.bg to black for the
  # original opaque look. Configured colours override the theme.
  # colors:
  #   default:      {fg: white, bg: default}
  #   popup:        {fg: white, bg: blue}
  #   popup_input:  {fg: white, bg: default}
  #   error:        {fg: white, bg: red}
  #   button:       {fg: magenta, bg: default}
  #   label:        {fg: black, bg: yellow}
  #   number:       {fg: yellow, bg: default}
  #   file_mp3:     {fg: green}
  #   file_dir:     {fg: blue}
  #   file_lst:     {fg: yellow}
  #   file_win:     {fg: magenta}

playback:
  # play_mode: allgroups     # onegroup, allgroups or allrandom
  # media_keys: true         # global media controls (Linux MPRIS, Windows hotkeys,
  #                          # macOS media keys); macOS requires Accessibility /
  #                          # Input Monitoring permission for the terminal app;
  #                          # false disables registration
  # repeat: false
  # fade_out: false          # fade out at the end of known-length tracks (toggle: V)
  # fade_seconds: 5          # fade duration in seconds (config file only, 0 disables)
  # skip_length: 10          # seconds skipped by rewind/forward
  # threads: 100             # read-ahead buffer in frames (0..500, step 50)
  # down_frequency: false
  # volume: 100              # 0..100
  # balance: 50              # 0..100, 50 = centre

files:
  # sort_mode: alpha         # alpha, alpha-case, modify-new, modify-old,
  #                          # size-small, size-big, none
  # display_mode: size       # file manager: plain, size or id3 (toggle: f)
  # hide_others: false       # hide files that are neither audio nor playlists
  # id3_names: false         # legacy default for file manager ID3 display
  # guess_legacy_tags: false # guess mislabeled UTF-8/GBK/GB18030 ID3 text;
  #                          # opt in: detection costs time on large lists
  # metadata_cache: true     # cache ID3 names and durations under ~/.config/mp3blasterr/cache;
  #                          # false disables persistent metadata caching
  # scan_mp3: false
  # playlist_dir: ~/playlists  # default: your home directory
  # audio_patterns: ['\.mp[123]$', '\.wav$', '\.ogg$', '\.oga$', '\.flac$', '^https?://']
  # playlist_patterns: ['\.lst$', '\.m3u$']
  # charset_table: /path/to/win2koi.tbl

selection:                   # select/deselect items by pattern (+ and -)
  # unselect_first: false
  # regex: false
  # case_insensitive: true

# Session state. On exit mp3blasterr writes the settings changed during the
# session back into this file (theme, nerd_font, wrap_around, display modes,
# threads, sort_mode, play_mode, repeat, fade_out, volume, balance and the settings below):
# existing values are updated in place, new ones are added to their
# section; comments and blank lines are kept. Command line options are not
# saved. The playlist is kept in ~/.config/mp3blasterr/session.lst and
# restored on the next start (unless files or a playlist are given on the
# command line); the last song is then ready to continue at its position
# with the play key.
state:
  # save: true               # false: never write this file or session.lst
  # last_dir: ~/Music        # start directory of the file manager
  # last_song: /path/to/song.mp3
  # last_position: 0         # seconds into last_song

# Key bindings: a single character, spc, ent, ins, hom, del, end, pup, pdn,
# up, dwn, lft, rig, bsp, f1..f64, kp0..kp9 or a scancode s<hex><hex>.
# Quote "#" and other YAML special characters. A configured key replaces
# all default keys of that command (e.g. toggle_repeat replaces both R and
# F6) and takes precedence over a default binding of another command using
# the same key. Commands of the file manager and of playback are grouped in
# the nested file: and play: sections.
# Bindings that are handy when F-keys are taken by the terminal emulator
# (repeat and shuffle already have R and Z):
keys:
  # select_files: "1"
  # remove_duplicates: "D"
  # add_group: "2"
  # set_group_title: "5"
  # toggle_repeat: "6"
  # toggle_shuffle: "7"
  # toggle_fade_out: v
  # toggle_playmode: "8"
  # toggle_sort: F
  # change_thread: "#"
  # load_playlist: l
  # write_playlist: w
  # file:
  #   add_files: "1"
  #   inv_selection: "2"
  #   recursive_select: "3"
  #   set_path: "4"
  #   dirs_as_groups: "5"
  #   add_url: "7"
  # play:
  #   next: n
  #   previous: b
  #   forward: N
  #   rewind: B
  #   play: p
  #   stop: s

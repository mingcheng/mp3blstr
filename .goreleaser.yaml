version: 2

project_name: mp3blstr

builds:
  - main: ./cmd/mp3blstr
    binary: mp3blstr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    gcflags:
      - github.com/ebitengine/purego/internal/fakecgo=-std
    ldflags:
      - '-s -w -X main.version={{ if .IsSnapshot }}dev{{ else }}{{ .Version }}{{ end }} -X main.buildDate={{ time "20060102" }}'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.sample.yaml
      - share/applications/mp3blstr.desktop

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

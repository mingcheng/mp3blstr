version: 2

project_name: mp3blstr

builds:
  - main: ./cmd/mp3blstr
    binary: mp3blstr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    gcflags:
      - github.com/ebitengine/purego/internal/fakecgo=-std
    # Derive the build date and file times from the commit so release builds
    # are reproducible.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - '-s -w -X main.version={{ if .IsSnapshot }}dev{{ else }}{{ .Version }}{{ end }} -X main.buildDate={{ replace (slice .CommitDate 0 10) "-" "" }}'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.sample.yaml
      - share/applications/mp3blstr.desktop

checksum:
  name_template: checksums.txt

changelog:
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^(chore|style|test|docs|ci|build)(\(.+\))?!?:'
      - '(?i)^merge (pull request|branch)'
      - '(?i)^agent host session'

release:
  prerelease: auto
